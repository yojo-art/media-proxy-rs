[env]
SYSTEM_DEPS_BUILD_INTERNAL="always"
# Linux の ld 専用フラグ。MSVC (Windows) では無効なため target 限定にする。
[target.'cfg(target_os = "linux")']
rustflags=["-C", "link-args=-Wl,-lc"]
# Windows (MSVC) では CRT を静的リンクする (+crt-static = /MT)。
# napi-rs テンプレートと同じ方針で、VC++ 再頒布可能パッケージの無い環境でも
# .node を読み込めるようにする。cc-rs 経由でビルドする C 依存も /MT になる。
# meson で直接ビルドする dav1d/lcms2 は build-deps.sh の MESON_VSCRT=mt で合わせること。
[target.x86_64-pc-windows-msvc]
rustflags=["-C", "target-feature=+crt-static"]
