[package]
name = "media-proxy-rs"
version = "1.0.0"
edition = "2021"

[features]
default = ["avif-decoder", "server"]
avif-decoder = ["dep:avif-decoder_dep", "dep:mp4parse", "dep:dav1d"]
serde = ["dep:serde"]
# フォントファイルを mmap で読む。長時間動く単体サーバー向け。
# napi (Node のプロセス内) では、フォントファイルの差し替えで SIGBUS に
# なるのを避けるため無効にする。
memmap-fonts = ["resvg/memmap-fonts"]
server = [
    "dep:axum",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:futures",
    "dep:futures-util",
    "dep:reqwest",
    "dep:tower-http",
    "dep:headers",
    "dep:mailparse",
    "dep:iprange",
    "dep:ipnet",
    "dep:lru",
    "serde",
    "dep:serde_json",
    "dep:chrono",
    "dep:urlencoding",
    "memmap-fonts",
]

[dependencies]
tokio-stream = { version = "0.1", optional = true }
axum = { version = "^0.8", features = ["http2"], optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "signal"], optional = true }
tokio-util = { version = "0.7.19", features = ["io"], optional = true }
futures = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
headers = { version = "^0.4.1", optional = true }
serde = { version = "^1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"], optional = true }
image = "^0.25.10"
webp = { git = "https://github.com/kozakura913/webp-rs.git", rev = "8e609215ac2e36dec51f31f7af56b41f6fdf8d91", default-features = false }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images", "svgz"] }
rexif = "0.7"
avif-decoder_dep = { path = "./avif-decoder_dep", optional = true }
chrono = { version = "0.4", optional = true }
fast_image_resize = "6.1"
jxl-oxide = { version = "0.12.6", features = ["image", "lcms2"] }
jpeg2k = { version = "0.10.1", default-features = false, features = ["image", "openjp2"] }
jpegxr = { git = "https://github.com/kozakura913/jpegxr", rev = "0cc3d7a5f33adbcc0aea402af5758905391db0f4" }
mp4parse = { version = "0.17", features = ["unstable-api"], optional = true }
dav1d = { version = "0.11", optional = true }
urlencoding = { version = "2.1.3", optional = true }
mailparse = { version = "0.17.0", optional = true }
iprange = { version = "0.6.7", optional = true }
ipnet = { version = "2", optional = true }
lru = { version = "0.18", optional = true }
tower-http = { version = "0.7", features = ["catch-panic"], optional = true }

[workspace]
members = ["."]

[[bin]]
name = "media-proxy-rs"
path = "src/main.rs"
required-features = ["server"]

[profile.release]
strip = true
opt-level = 3
lto = "thin"

[[example]]
name = "healthcheck"
required-features = ["server"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
