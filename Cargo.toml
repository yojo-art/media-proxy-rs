[package]
name = "media-proxy-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["avif-decoder"]
avif-decoder = ["dep:avif-decoder_dep", "dep:mp4parse", "dep:dav1d"]

[dependencies]
tokio-stream = "0.1"
axum = { version = "^0.8", features = ["http2"] }
tokio = { version = "1.53", features = ["rt-multi-thread","signal"] }
tokio-util = { version = "0.7.19", features = ["io"] }
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
headers = "^0.4.1"
serde = {version="^1.0.229",features=["derive"]}
serde_json ="1"
reqwest = { version = "0.13", default-features = false , features = ["stream","rustls"] }
image = "^0.25.10"
#webp = { version = "0.3.0", default-features = false }
webp = { git="https://github.com/kozakura913/webp-rs.git" ,rev = "8e609215ac2e36dec51f31f7af56b41f6fdf8d91", default-features = false }
resvg = {version="0.48",features = [ "text","memmap-fonts","raster-images" ] }
rexif = "0.7"
avif-decoder_dep = { path="./avif-decoder_dep" ,optional = true }
chrono = "0.4"
fast_image_resize = "6.1"
jxl-oxide =  {version="0.12.6",features = [ "image","lcms2" ] }
jpeg2k = { version = "0.10.1", default-features = false , features = ["image","openjp2"] }
jpegxr = { git="https://github.com/kozakura913/jpegxr" ,rev = "0cc3d7a5f33adbcc0aea402af5758905391db0f4" }
mp4parse = { version = "0.17", features = ["unstable-api"], optional = true }
dav1d = { version = "0.11", optional = true }
urlencoding = "2.1.3"
mailparse = "0.17.0"
iprange = "0.6.7"
ipnet = "2"
lru = "0.18"
tower-http = { version = "0.7", features = ["catch-panic"] }

[profile.release]
strip = true
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
