name: cargo fmt check

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        id: fmt
        continue-on-error: true
        run: |
          cargo fmt --all -- --check
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post comment on failure
        if: github.event_name == 'pull_request' && steps.fmt.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cargo-fmt-check -->';
            const body = `${marker}
            ## :warning: cargo fmt チェック失敗

            \`cargo fmt\` を実行してください。
            `;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) =>
              c.body && c.body.includes(marker) && c.user && (c.user.login === 'github-actions[bot]' || c.user.type === 'Bot')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Resolve comment on success
        if: github.event_name == 'pull_request' && steps.fmt.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cargo-fmt-check -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) =>
              c.body && c.body.includes(marker) && c.user && (c.user.login === 'github-actions[bot]' || c.user.type === 'Bot')
            );
            if (existing && existing.body.includes('チェック失敗')) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: `${marker}\n## :white_check_mark: cargo fmt チェック通過`,
              });
            }

      - name: Fail if unformatted
        if: steps.fmt.outputs.exit_code != '0'
        run: |
          echo "::error::cargo fmt --check failed. Run 'cargo fmt' locally and push again."
          exit 1
